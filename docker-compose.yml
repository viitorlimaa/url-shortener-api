services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: url_shortener
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "pnpm install && pnpm prisma generate && pnpm start:dev"

  db:
    image: postgres:16-alpine
    container_name: nest-api-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nest_api}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nest_api"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
